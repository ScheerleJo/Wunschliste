# Produktion (z. B. LXC/VM auf Proxmox). Nginx Proxy Manager leitet
# wunschbaum.basislager.cloud auf Port 3000 dieses Hosts weiter.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://wunschliste:${POSTGRES_PASSWORD:-wunschliste}@db:5432/wunschliste
      UPLOAD_DIR: /data/uploads
      # TODO: echten SMTP-Server eintragen, solange fängt Mailpit alle Mails ab
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wunschliste
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wunschliste}
      POSTGRES_DB: wunschliste
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wunschliste"]
      interval: 5s
      retries: 10

  # Übergangsweise: fängt alle Mails ab (Einladungen, Magic Links, Passwort-Reset).
  # Oberfläche nur im lokalen Netz freigeben!
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  db:
  uploads:
