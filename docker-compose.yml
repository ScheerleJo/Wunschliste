# Produktion (z. B. LXC/VM auf Proxmox).
# Der Nginx Proxy Manager leitet wunschbaum.basislager.cloud auf APP_PORT (Standard 3000) dieses Hosts weiter.
#
#   docker compose up -d --build          Starten bzw. nach git pull aktualisieren
#   docker compose logs -f app            Logs ansehen
#   docker compose --profile mailpit up -d   zusätzlich Mailpit starten (fängt Mails ab, nur zum Testen)
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://wunschliste:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}@db:5432/wunschliste
      UPLOAD_DIR: /data/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wunschliste
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: wunschliste
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wunschliste"]
      interval: 5s
      retries: 10

  # Optional zum Testen: fängt alle Mails ab (dann SMTP_HOST=mailpit, SMTP_PORT=1025 in .env).
  # Oberfläche unter http://<server>:8025 – nur im lokalen Netz verwenden!
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    profiles: ["mailpit"]
    ports:
      - "8025:8025"

volumes:
  db:
  uploads:
